<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 610" width="1500" height="610" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <g id="gnd" stroke="#1a1a1a" stroke-width="2">
      <line x1="-12" y1="0" x2="12" y2="0"/><line x1="-8" y1="5" x2="8" y2="5"/><line x1="-4" y1="10" x2="4" y2="10"/>
    </g>
    <!-- capacitor vertical: fio de (0,0) ate (0,85), placas em 40 e 48, terra em 85 -->
    <g id="cgnd" stroke="#1a1a1a" stroke-width="2">
      <line x1="0" y1="0" x2="0" y2="40"/><line x1="-14" y1="40" x2="14" y2="40"/><line x1="-14" y1="48" x2="14" y2="48"/><line x1="0" y1="48" x2="0" y2="85"/>
      <use href="#gnd" x="0" y="85"/>
    </g>
    <!-- resistor vertical para o terra: fio de (0,0), corpo de 25 a 85, terra em 110 -->
    <g id="rgnd" stroke="#1a1a1a" stroke-width="2">
      <line x1="0" y1="0" x2="0" y2="25"/><rect x="-10" y="25" width="20" height="60" fill="#fff"/><line x1="0" y1="85" x2="0" y2="110"/>
      <use href="#gnd" x="0" y="110"/>
    </g>
    <!-- amp op: entrada + em (0,-25), entrada - em (0,25), saida em (90,0) -->
    <g id="amp">
      <polygon points="0,-50 0,50 90,0" fill="#fff" stroke="#1a1a1a" stroke-width="2"/>
      <text x="9" y="-19" font-size="18" fill="#1a1a1a">+</text>
      <text x="9" y="31" font-size="18" fill="#1a1a1a">−</text>
    </g>
  </defs>

  <rect width="1500" height="610" fill="#ffffff"/>

  <!-- fundos dos estagios -->
  <g fill="#f3f6f9">
    <rect x="100" y="28" width="375" height="372" rx="6"/>
    <rect x="497" y="28" width="448" height="372" rx="6"/>
    <rect x="967" y="28" width="448" height="372" rx="6"/>
  </g>
  <g font-size="15" font-weight="bold" fill="#1a1a1a" text-anchor="middle">
    <text x="287" y="20">Estágio 1: primeira ordem, ganho 3</text>
    <text x="721" y="20">Estágio 2: Sallen-Key, ganho 1,39</text>
    <text x="1191" y="20">Estágio 3: Sallen-Key, ganho 2,38</text>
  </g>

  <!-- ===================== fios ===================== -->
  <g stroke="#1a1a1a" stroke-width="2" fill="none">
    <!-- estagio 1 -->
    <line x1="55" y1="125" x2="130" y2="125"/>
    <line x1="190" y1="125" x2="330" y2="125"/>
    <polyline points="330,175 290,175 290,260 330,260"/>
    <polyline points="390,260 450,260 450,150"/>
    <line x1="420" y1="150" x2="450" y2="150"/>
    <polyline points="450,150 490,150 490,125 510,125"/>
    <!-- estagio 2 -->
    <line x1="570" y1="125" x2="630" y2="125"/>
    <line x1="690" y1="125" x2="800" y2="125"/>
    <polyline points="600,125 600,65 740,65"/>
    <polyline points="748,65 920,65 920,150"/>
    <polyline points="800,175 760,175 760,260 800,260"/>
    <polyline points="860,260 920,260 920,150"/>
    <line x1="890" y1="150" x2="920" y2="150"/>
    <polyline points="920,150 960,150 960,125 980,125"/>
    <!-- estagio 3 -->
    <line x1="1040" y1="125" x2="1100" y2="125"/>
    <line x1="1160" y1="125" x2="1270" y2="125"/>
    <polyline points="1070,125 1070,65 1210,65"/>
    <polyline points="1218,65 1390,65 1390,150"/>
    <polyline points="1270,175 1230,175 1230,260 1270,260"/>
    <polyline points="1330,260 1390,260 1390,150"/>
    <line x1="1360" y1="150" x2="1450" y2="150"/>
    <!-- placas dos capacitores de realimentacao -->
    <line x1="740" y1="51" x2="740" y2="79"/><line x1="748" y1="51" x2="748" y2="79"/>
    <line x1="1210" y1="51" x2="1210" y2="79"/><line x1="1218" y1="51" x2="1218" y2="79"/>
  </g>

  <!-- resistores horizontais -->
  <g fill="#fff" stroke="#1a1a1a" stroke-width="2">
    <rect x="130" y="115" width="60" height="20"/>
    <rect x="330" y="250" width="60" height="20"/>
    <rect x="510" y="115" width="60" height="20"/>
    <rect x="630" y="115" width="60" height="20"/>
    <rect x="800" y="250" width="60" height="20"/>
    <rect x="980" y="115" width="60" height="20"/>
    <rect x="1100" y="115" width="60" height="20"/>
    <rect x="1270" y="250" width="60" height="20"/>
  </g>

  <!-- capacitores e resistores para o terra -->
  <use href="#cgnd" x="260" y="125"/>
  <use href="#cgnd" x="730" y="125"/>
  <use href="#cgnd" x="1200" y="125"/>
  <use href="#rgnd" x="290" y="260"/>
  <use href="#rgnd" x="760" y="260"/>
  <use href="#rgnd" x="1230" y="260"/>

  <!-- amplificadores -->
  <use href="#amp" x="330" y="150"/>
  <use href="#amp" x="800" y="150"/>
  <use href="#amp" x="1270" y="150"/>

  <!-- nos -->
  <g fill="#1a1a1a">
    <circle cx="260" cy="125" r="3.5"/><circle cx="290" cy="260" r="3.5"/><circle cx="450" cy="150" r="3.5"/>
    <circle cx="600" cy="125" r="3.5"/><circle cx="730" cy="125" r="3.5"/><circle cx="760" cy="260" r="3.5"/><circle cx="920" cy="150" r="3.5"/>
    <circle cx="1070" cy="125" r="3.5"/><circle cx="1200" cy="125" r="3.5"/><circle cx="1230" cy="260" r="3.5"/><circle cx="1390" cy="150" r="3.5"/>
  </g>

  <!-- terminais de entrada e saida -->
  <g fill="#fff" stroke="#1a1a1a" stroke-width="2">
    <circle cx="50" cy="125" r="5"/><circle cx="1455" cy="150" r="5"/>
  </g>
  <g font-size="15" font-weight="bold" fill="#1a1a1a" text-anchor="middle">
    <text x="50" y="106">Vin</text>
    <text x="1455" y="131">Vout</text>
  </g>
  <g font-size="12" fill="#444" text-anchor="middle">
    <text x="50" y="150">1 Vpp</text>
    <text x="1455" y="175">CH2</text>
    <text x="50" y="166">CH1</text>
  </g>

  <!-- nomes dos componentes -->
  <g font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">
    <text x="160" y="107">R7</text>
    <text x="360" y="243">R1</text>
    <text x="540" y="107">R9</text>
    <text x="660" y="107">R8</text>
    <text x="830" y="243">R3</text>
    <text x="1010" y="107">R11</text>
    <text x="1130" y="107">R10</text>
    <text x="1300" y="243">R5</text>
    <text x="744" y="43">C3</text>
    <text x="1214" y="43">C5</text>
    <text x="375" y="93">U1A</text>
    <text x="845" y="93">U1B</text>
    <text x="1315" y="93">U2A</text>
  </g>
  <g font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="end">
    <text x="238" y="166">C1</text>
    <text x="708" y="166">C2</text>
    <text x="1178" y="166">C4</text>
    <text x="270" y="312">R2</text>
    <text x="740" y="312">R4</text>
    <text x="1210" y="312">R6</text>
  </g>

  <!-- valores -->
  <g font-size="13" fill="#0b5cad" text-anchor="middle">
    <text x="160" y="152">16 kΩ</text>
    <text x="360" y="288">20 kΩ</text>
    <text x="360" y="304">(10 k + 10 k)</text>
    <text x="540" y="152">16 kΩ</text>
    <text x="660" y="152">16 kΩ</text>
    <text x="830" y="288">3,9 kΩ</text>
    <text x="1010" y="152">16 kΩ</text>
    <text x="1130" y="152">16 kΩ</text>
    <text x="1300" y="288">13,8 kΩ</text>
    <text x="1300" y="304">(12 k + 1,8 k)</text>
    <text x="744" y="97">10 nF</text>
    <text x="1214" y="97">10 nF</text>
  </g>
  <g font-size="13" fill="#0b5cad" text-anchor="end">
    <text x="238" y="182">10 nF</text>
    <text x="708" y="182">10 nF</text>
    <text x="1178" y="182">10 nF</text>
    <text x="270" y="328">10 kΩ</text>
    <text x="740" y="328">10 kΩ</text>
    <text x="1210" y="328">10 kΩ</text>
  </g>

  <!-- numeros dos pinos -->
  <g font-size="13" font-weight="bold" fill="#b3261e">
    <text x="322" y="119" text-anchor="end">3</text>
    <text x="322" y="169" text-anchor="end">2</text>
    <text x="427" y="143">1</text>
    <text x="792" y="119" text-anchor="end">5</text>
    <text x="792" y="169" text-anchor="end">6</text>
    <text x="897" y="143">7</text>
    <text x="1262" y="119" text-anchor="end">3</text>
    <text x="1262" y="169" text-anchor="end">2</text>
    <text x="1367" y="143">1</text>
  </g>

  <!-- ===================== parte de baixo ===================== -->
  <line x1="30" y1="418" x2="1470" y2="418" stroke="#c8ced6" stroke-width="1"/>

  <!-- pinagem do TL082 -->
  <text x="235" y="442" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">TL082, visto de cima</text>
  <g stroke="#1a1a1a" stroke-width="2">
    <rect x="170" y="455" width="130" height="135" rx="5" fill="#fff"/>
    <path d="M 223 455 A 12 12 0 0 0 247 455" fill="#fff"/>
    <line x1="155" y1="478" x2="170" y2="478"/><line x1="155" y1="510" x2="170" y2="510"/><line x1="155" y1="542" x2="170" y2="542"/><line x1="155" y1="574" x2="170" y2="574"/>
    <line x1="300" y1="478" x2="315" y2="478"/><line x1="300" y1="510" x2="315" y2="510"/><line x1="300" y1="542" x2="315" y2="542"/><line x1="300" y1="574" x2="315" y2="574"/>
  </g>
  <g font-size="13" font-weight="bold" fill="#b3261e">
    <text x="178" y="483">1</text><text x="178" y="515">2</text><text x="178" y="547">3</text><text x="178" y="579">4</text>
    <text x="292" y="483" text-anchor="end">8</text><text x="292" y="515" text-anchor="end">7</text><text x="292" y="547" text-anchor="end">6</text><text x="292" y="579" text-anchor="end">5</text>
  </g>
  <g font-size="13" fill="#1a1a1a">
    <g text-anchor="end">
      <text x="148" y="483">saída A</text><text x="148" y="515">entrada − A</text><text x="148" y="547">entrada + A</text><text x="148" y="579">−15 V</text>
    </g>
    <text x="322" y="483">+15 V</text><text x="322" y="515">saída B</text><text x="322" y="547">entrada − B</text><text x="322" y="579">entrada + B</text>
  </g>

  <!-- notas -->
  <text x="470" y="442" font-size="14" font-weight="bold" fill="#1a1a1a">Alimentação e ligações que não aparecem no desenho</text>
  <g font-size="13" fill="#1a1a1a">
    <text x="470" y="470">• U1 e U2: pino 8 em +15 V, pino 4 em −15 V.</text>
    <text x="470" y="494">• Desacoplamento: 100 nF do pino 8 ao terra e 100 nF do</text>
    <text x="482" y="512">pino 4 ao terra, junto de cada CI.</text>
    <text x="470" y="536">• Amplificador de sobra (U2B): pino 5 no terra,</text>
    <text x="482" y="554">pino 6 ligado ao pino 7.</text>
    <text x="470" y="578">• Fonte, gerador e osciloscópio no mesmo terra.</text>
  </g>

  <!-- conferencia -->
  <text x="960" y="442" font-size="14" font-weight="bold" fill="#1a1a1a">Conferência em 100 Hz, com Vin = 1 Vpp</text>
  <g font-size="13" fill="#1a1a1a">
    <rect x="960" y="454" width="440" height="26" fill="#f3f6f9"/>
    <rect x="960" y="506" width="440" height="26" fill="#f3f6f9"/>
    <text x="970" y="472" font-weight="bold">Ponto</text><text x="1390" y="472" font-weight="bold" text-anchor="end">Esperado</text>
    <text x="970" y="498">U1 pino 1 (saída do estágio 1)</text><text x="1390" y="498" text-anchor="end">3,0 Vpp</text>
    <text x="970" y="524">U1 pino 7 (saída do estágio 2)</text><text x="1390" y="524" text-anchor="end">4,2 Vpp</text>
    <text x="970" y="550">U2 pino 1 (Vout)</text><text x="1390" y="550" text-anchor="end">9,9 Vpp</text>
    <text x="970" y="580" fill="#444">Corte previsto: 995 Hz, com Vout em 7,0 Vpp.</text>
  </g>
</svg>
